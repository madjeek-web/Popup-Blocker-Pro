name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/popup-blocker-pro/package.json

      - name: Install dependencies
        working-directory: src/popup-blocker-pro
        run: npm ci

      - name: Validate manifest.json (Chrome)
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/popup-blocker-pro/src/manifest.json', 'utf8'));
            if (!manifest.manifest_version) throw new Error('Missing manifest_version');
            if (!manifest.name) throw new Error('Missing name');
            if (!manifest.version) throw new Error('Missing version');
            console.log('✅ manifest.json (Chrome MV3) valid — version:', manifest.version);
          "

      - name: Validate manifest.firefox.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/popup-blocker-pro/src/manifest.firefox.json', 'utf8'));
            if (!manifest.manifest_version) throw new Error('Missing manifest_version');
            console.log('✅ manifest.firefox.json valid — version:', manifest.version);
          "

      - name: Lint JavaScript (basic syntax check)
        working-directory: src/popup-blocker-pro
        run: node --check src/content.js && node --check src/background.js && node --check src/popup.js && node --check src/options.js && echo "✅ All JS files syntax OK"

      - name: Check required files exist
        run: |
          files=(
            "src/popup-blocker-pro/src/manifest.json"
            "src/popup-blocker-pro/src/manifest.firefox.json"
            "src/popup-blocker-pro/src/content.js"
            "src/popup-blocker-pro/src/background.js"
            "src/popup-blocker-pro/src/popup.html"
            "src/popup-blocker-pro/src/popup.js"
            "src/popup-blocker-pro/src/popup.css"
            "src/popup-blocker-pro/src/options.html"
            "src/popup-blocker-pro/src/options.js"
            "src/popup-blocker-pro/src/icons/icon16.png"
            "src/popup-blocker-pro/src/icons/icon48.png"
            "src/popup-blocker-pro/src/icons/icon128.png"
            "releases/popup-blocker-pro-chrome.zip"
            "releases/popup-blocker-pro-firefox.zip"
            "LICENSE"
            "README.md"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "❌ Missing: $f"; exit 1; fi
            echo "✅ $f"
          done

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Chrome package
        run: |
          cd src/popup-blocker-pro/src
          zip -r ../../../dist/popup-blocker-pro-chrome.zip . -x "*.DS_Store" -x "*manifest.firefox.json"
          echo "✅ Chrome package built"

      - name: Build Firefox package
        run: |
          mkdir -p dist
          cp src/popup-blocker-pro/src/manifest.firefox.json src/popup-blocker-pro/src/manifest.json.bak
          cd src/popup-blocker-pro/src
          zip -r ../../../dist/popup-blocker-pro-firefox.zip . -x "*.DS_Store"
          cd ../../..
          mv src/popup-blocker-pro/src/manifest.json.bak src/popup-blocker-pro/src/manifest.json
          echo "✅ Firefox package built"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/
          retention-days: 7
