name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=(
            "LICENSE"
            "README.md"
            "releases/popup-blocker-pro-chrome.zip"
            "releases/popup-blocker-pro-firefox.zip"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Validate manifests JSON syntax
        run: |
          for f in $(find . -name "manifest*.json" -not -path "*/node_modules/*"); do
            python3 -m json.tool "$f" > /dev/null && echo "✅ Valid JSON: $f" || (echo "❌ Invalid JSON: $f" && exit 1)
          done

      - name: Check JavaScript syntax
        run: |
          for f in $(find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/build-scripts/*"); do
            node --check "$f" && echo "✅ $f" || (echo "❌ Syntax error: $f" && exit 1)
          done
